name: CI

on:
  push:
      branches: [ "main" ]
  pull_request:
      branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: 1.98.0
        components: rustfmt, clippy

    - name: Cache cargo registry
      uses: actions/cache@v6
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo index
      uses: actions/cache@v6
      with:
        path: ~/.cargo/git
        key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo build
      uses: actions/cache@v6
      with:
        path: target
        key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

    - name: Check formatting
      run: cargo fmt --all -- --check

    - name: Run clippy
      run: cargo clippy --all-targets --all-features -- -D warnings

    - name: Build (default features)
      run: cargo build

    - name: Build (all features)
      run: cargo build --all-features

    - name: Check benchmarks
      run: cargo check --benches --all-features

    - name: Check examples (default features)
      run: cargo check --examples

    - name: Check examples (all features)
      # Examples gated behind `required-features` (e.g. scheduler_*) only get
      # a build check when their feature is enabled.
      run: cargo check --examples --all-features

    - name: Run tests (default features)
      run: cargo test --lib

    - name: Run tests (all features)
      # Feature-gated lib tests, including full scheduler coverage.
      # `--lib` never runs the `cano/tests/*` integration tests; the next step runs the tracing ones.
      run: cargo test --lib --all-features

    - name: Test (tracing integration)
      # `tracing_span_context` and `tracing_tests` are integration tests gated on
      # `#[cfg(feature = "tracing")]`, so they need `--all-features`.
      run: cargo test -p cano --all-features --test tracing_span_context --test tracing_tests

    - name: Run doctests
      run: cargo test --doc --all-features

    - name: Check cano-e2e compiles
      # `cano-e2e` is excluded from the default workspace selection (heavy Docker test
      # deps); a compile-only check of its lib + bin here keeps it from bit-rotting. The
      # Docker tests (and clippy on them) run in `e2e.yml`.
      run: cargo check -p cano-e2e

  security_audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
    
    - name: Install cargo-audit
      uses: taiki-e/install-action@cargo-audit
    
    - name: Run security audit
      run: cargo audit