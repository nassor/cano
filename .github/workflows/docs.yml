name: Docs
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # A half-applied Pages deployment is worse than a queued one, so runs wait
  # instead of cancelling each other.
  group: pages
  cancel-in-progress: false
env:
  # Pinned for template filter compatibility (`trim_end`, `replace`) and Tera
  # body rendering. Rebuild and link-check the site before bumping.
  ZOLA_VERSION: 0.23.4
  ZOLA_SHA256: 54d1a347781b2f32330914fcc02def81c7e3ddb6111b36d1cc89c06557aed1de
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Zola
        run: |
          asset="zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl -sSfL -o "${RUNNER_TEMP}/zola.tar.gz" \
            "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/${asset}"
          echo "${ZOLA_SHA256}  ${RUNNER_TEMP}/zola.tar.gz" | sha256sum --check --strict
          mkdir -p "${RUNNER_TEMP}/zola-bin"
          tar -xzf "${RUNNER_TEMP}/zola.tar.gz" -C "${RUNNER_TEMP}/zola-bin" zola
          echo "${RUNNER_TEMP}/zola-bin" >> "${GITHUB_PATH}"
      - run: zola --version
      - run: zola build
        working-directory: docs
      - name: Link check
        # Gating: a broken internal link fails here.
        run: zola check
        working-directory: docs
      - name: Build search index
        # Every page is hand-authored HTML inside its markdown body, which Zola's
        # own search index never sees; base.html reads the `search-index.json`
        # this script writes from the rendered `public/` tree.
        run: python3 search-index.py public
        working-directory: docs
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/public
  deploy:
    # Pull requests get the build and the link check above and stop here. A
    # `workflow_dispatch` on `main` republishes the site without a new commit.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
