name: Deploy Documentation

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Pin the version: an unpinned `tool: zola` resolves to whatever the
      # action's manifest currently offers, so a zola release can break the
      # docs build without a repo change. 0.22.1 is the version the site is
      # developed and verified against — notably its handling of shortcodes
      # (`cano_dep`) inside fenced code blocks, which an unpinned build got
      # wrong with `Unknown function 'cano_dep'`.
      - name: Install Zola
        uses: taiki-e/install-action@v2
        with:
          tool: zola@0.22.1

      - name: Build site
        working-directory: docs
        run: zola build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs/public'

  deploy:
    needs: build
    environment:
      name: "github-pages"
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
