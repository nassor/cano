base_url = "https://nassor.github.io/cano"
title = "Cano"
description = "Async workflow orchestration engine for Rust built on Finite State Machines."
default_language = "en"
compile_sass = false
build_search_index = false
generate_feeds = false

# Output to docs/public so the GitHub Pages workflow can upload it. Gitignored
# — it's a build artifact regenerated by CI on every `v*` tag push, never
# committed.
output_dir = "public"

# Pretty URLs (default true): /world.md -> /world/
[markdown]
render_emoji = false

[extra]
version = "0.15.2"
github_url = "https://github.com/nassor/cano"
crates_url = "https://crates.io/crates/cano"
docsrs_url = "https://docs.rs/cano"

# The reading order, declared once. `base.html` renders the sidebar, the
# breadcrumb and the previous/next pager from this list, so all three always
# agree. A group is `label` + `items`; an item is `title` + `path` and may
# carry its own nested `children` (same shape) for a sub-page that belongs
# under it in both the sidebar tree and the reading order.
[[extra.nav]]
label = "Start"
[[extra.nav.items]]
title = "Home"
path = "@/_index.md"

