[package]
name = "cano"
description = "High-performance orchestration engine for building resilient, self-healing systems in Rust. Uses Finite State Machines (FSM) for strict, type-safe transitions."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
authors.workspace = true
readme = "../README.md"
keywords = ["framework", "async", "workflow", "data-processing", "ai"]
categories = ["development-tools", "concurrency", "asynchronous"]

# No lints of its own. The empty table tells cargo this is intentional: a workspace that depends on cano by path and
# defines `[workspace.lints]` otherwise gets a `missing_lints_inheritance` warning on every build.
[lints]

[dependencies]
cano-macros.workspace = true
tokio = { version = "1.54.1", default-features = false, features = ["macros", "sync"] }
rand = "0.10"
chrono = { version = "0.4", features = ["serde"], optional = true }
cron = { version = "0.17.0", optional = true }
futures-util = "0.3"
tokio-util = { version = "0.7", default-features = false }
parking_lot = { version = "0.13", optional = true }
smallvec = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = { version = "0.1.44", optional = true }
redb = { version = "4.6", optional = true }
postcard = { version = "1", default-features = false, features = ["use-std"], optional = true }
metrics = { version = "0.24.6", optional = true }
tokio-postgres = { version = "0.7.18", optional = true }
deadpool-postgres = { version = "0.14.2", optional = true }
async-nats = { version = "0.52.0", default-features = false, features = ["kv", "ring", "nkeys", "nuid", "server_2_10", "server_2_11", "server_2_12", "server_2_14"], optional = true }
bytes = { version = "1", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasip3 = { version = "0.10", optional = true }

[features]
default = ["runtime-tokio", "store-redb"]
runtime-tokio = ["tokio/time", "tokio/rt", "tokio/rt-multi-thread", "dep:parking_lot"]
wasm = ["dep:wasip3"]
scheduler = ["runtime-tokio", "dep:chrono", "dep:cron", "tokio/signal"]
tracing = ["dep:tracing"]
store-redb = ["runtime-tokio", "dep:redb", "dep:postcard"]
store-postgres = ["runtime-tokio", "dep:tokio-postgres", "dep:deadpool-postgres"]
store-nats = ["runtime-tokio", "dep:async-nats", "dep:postcard", "dep:bytes"]
metrics = ["dep:metrics"]
testing = []
all = ["runtime-tokio", "scheduler", "tracing", "store-redb", "store-postgres", "store-nats", "metrics", "testing"]

[dev-dependencies]
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
axum = "0.8.9"
redb = "4.6"
criterion = { version = "0.8", features = ["html_reports", "async_tokio"] }
cuca = { version = "0.9", features = ["provider-lmstudio"] }
parking_lot = "0.13"
tempfile = "3"
wide = "1.7"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1.54.1", features = ["macros", "sync", "time", "rt-multi-thread", "signal", "test-util"] }
metrics-util = { version = "0.20.4", features = ["debugging"] }
metrics-tracing-context = "0.18.1"

# Subprocess driver for the SIGKILL recovery integration test (tests/recovery_e2e.rs).
# A [[bin]] (not an example) so `cargo test --features testing` (with the default
# `store-redb`) builds it and sets
# CARGO_BIN_EXE_recovery_resume for the test harness.
[[bin]]
name = "recovery_resume"
path = "src/bin/recovery_resume.rs"
required-features = ["testing", "store-redb"]

# Subprocess driver for the SIGKILL SteppedTask cursor-persistence e2e test
# (tests/stepped_resume_e2e.rs).
[[bin]]
name = "stepped_resume"
path = "src/bin/stepped_resume.rs"
required-features = ["testing", "store-redb"]

